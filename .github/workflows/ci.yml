name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # Accessibility as a build-time contract: fails the PR if any
      # semantic pairing drops below its WCAG 2.2 threshold. Runs after
      # build because it reads the built CSS, not the DTCG source.
      - run: python3 scripts/verify-contrast.py